---
# see https://github.com/nextapps-de/flexsearch#tokenizer-prefix-search for options
tokenizer: "full" # strict, forward, reverse, full
custom_domain: ""
fail_on_validation: false
searchableAttributes:
  - "prefLabel" # you should not delete this one
  - "notation"
  - "altLabel"
  - "hiddenLabel"
  - "example"
  - "definition"
  - "scopeNote"
  - "editorialNote"
ui:
  title: "Climate Connectivity Taxonomy" # Title is mandatory
  logo: "skohub-signet-color.svg" # Path
  colors:
    skoHubWhite: "rgb(255, 255, 255)"
    skoHubDarkColor: "rgb(15, 85, 75)"
    skoHubMiddleColor: "rgb(20, 150, 140)"
    skoHubLightColor: "rgb(40, 200, 175)"
    skoHubThinColor: "rgb(55, 250, 210)"
    skoHubBlackColor: "rgb(5, 30, 30)"
    skoHubAction: "rgb(230, 0, 125)"
    skoHubNotice: "rgb(250, 180, 50)"
    skoHubDarkGrey: "rgb(155, 155, 155)"
    skoHubMiddleGrey: "rgb(200, 200, 200)"
    skoHubLightGrey: "rgb(235, 235, 235)"
  fonts:
    regular:
      font_family: "Ubuntu"
      font_style: "normal"
      font_weight: 400
      name: "ubuntu-v20-latin-regular"
    bold:
      font_family: "Ubuntu"
      font_style: "normal"
      font_weight: 700
      name: "ubuntu-v20-latin-700"
  footer:
    links:
      # How the taxonomy was built (requested by the connectivity-hub team). Keep in
      # sync with METHODOLOGY_URL in scripts/prepare_vocab.py and
      # scripts/patch_scheme_links.sh (scheme page, below "License").
      - title: "Methodology"
        url: "https://docs.google.com/document/d/1uPh00X7Et_E4Wsp4tqeIurVzxPW4gsuEXY136ghXTzc/view"
        target: "_blank"
        rel: "noopener noreferrer"
      # Must match DEFAULT_LICENSE in scripts/prepare_vocab.py.
      - title: "Licence: CC BY 4.0"
        url: "https://creativecommons.org/licenses/by/4.0/"
        target: "_blank"
        rel: "noopener noreferrer"
      # Upstream source of the vocabulary. Also linked on the scheme page by
      # scripts/patch_scheme_links.sh — keep in sync.
      - title: "Connectivity Hub"
        url: "https://connectivity-hub.weadapt.org/"
        target: "_blank"
        rel: "noopener noreferrer"
      - title: "Source on GitHub"
        url: "https://github.com/FAIR2Adapt/climate-connectivity-taxonomy"
        target: "_blank"
        rel: "noopener noreferrer"
      # Tool credit (replaces SkoHub's default "© SkoHub" and hbz Impressum /
      # Datenschutz links, which describe hbz, not this project).
      - title: "Built with SkoHub"
        url: "https://skohub.io"
        target: "_blank"
        rel: "noopener noreferrer"
