name: Build and deploy Climate Connectivity Taxonomy to GitHub Pages

# Builds a static SkoHub Vocabs site from the committed concepts.ttl and publishes
# it to GitHub Pages. This workflow does NOT touch the connectivity-hub — it builds
# only from the versioned concepts.ttl in the repo, so deploys are fast and never
# degraded by hub flakiness. The data is refreshed separately by refresh-vocab.yml,
# which fetches from the hub and commits a fresh concepts.ttl (only when complete);
# it then starts this workflow.
#
# The methodology page (/methodology/, HTML + PDF) is rendered from the committed
# snapshot in methodology/ by scripts/render_methodology.sh. That snapshot is taken
# from the connectivity-hub team's Google Doc by refresh-vocab.yml, like
# concepts.ttl, so this workflow never contacts Google either.
#
# Pull requests run the build without deploying and attach the built site as a
# downloadable "site-preview" artifact, so changes can be reviewed before merging.

on:
  # rebuild when the data or the pipeline changes
  push:
    branches: [main]
    paths:
      - concepts.ttl
      - methodology/**
      - config.yaml
      - scripts/**
      - requirements.txt
      - .github/workflows/pages.yml
  # build (but don't deploy) pull requests, for preview
  pull_request:
    paths:
      - concepts.ttl
      - methodology/**
      - config.yaml
      - scripts/**
      - requirements.txt
      - .github/workflows/pages.yml
  # let the maintainer rebuild from the committed data by hand
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but let an in-progress run finish. PR preview
# builds get their own group per PR so they never queue behind deployments.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install pandoc
        # for the methodology page (scripts/render_methodology.sh)
        run: sudo apt-get update -q && sudo apt-get install -y -q pandoc

      - name: Build the site
        # scripts/build_site.sh normalises the committed concepts.ttl, builds it with
        # SkoHub (plus our patches), post-processes the tree and renders the
        # methodology page from methodology/ — no live fetch from the hub or Google.
        # Project Pages are served from /<repo>, so the site is built with that path
        # prefix (SkoHub reads it from BASEURL).
        run: BASEURL="/${GITHUB_REPOSITORY#*/}" bash scripts/build_site.sh

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

      - name: Upload the built site for preview (pull requests)
        # To browse it: download "site-preview", unzip it into a folder named
        # climate-connectivity-taxonomy, run `python3 -m http.server` in the folder
        # *above* it, and open http://localhost:8000/climate-connectivity-taxonomy/
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: public
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
