name: Tests

# Unit tests for scripts/, plus checks that the committed concepts.ttl normalises
# into a complete, well-formed vocabulary (see tests/).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Run the tests
        run: pytest -v tests
